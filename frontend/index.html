<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- PWA / standalone: iPhone Safari cannot true-fullscreen a canvas, so "Add to Home Screen"
         + these tags give the only chromeless view iOS offers a web app (#13 immersive follow-up). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ADSB-GAME" />
    <meta name="theme-color" content="#05070a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-192.png" />
    <title>ADSB-GAME</title>
  </head>
  <body style="background:#05070a">
    <div id="root"></div>
    <!-- Boot watchdog (#25): if the app bundle never mounts (blocked by Safari privacy
         protections, WebGL unavailable, or a failed asset fetch), replace the silent white
         page with a named, honest failure. Inline so it works with ZERO network; the CSP in
         public/_headers carries this script's sha256 hash — update it if this changes. -->
    <script>(function(){function show(){var r=document.getElementById('root');if(r&&r.children.length>0)return;if(document.getElementById('boot-fail'))return;var d=document.createElement('div');d.id='boot-fail';d.setAttribute('style','position:fixed;inset:0;z-index:9999;background:#05070a;color:#5fd7e0;font-family:monospace;padding:28px;font-size:14px;line-height:1.7;letter-spacing:0.04em');d.innerHTML='<div style="color:#ffb000;font-size:16px;margin-bottom:12px">ADSB-GAME DID NOT START</div><div>THE APP BUNDLE FAILED TO LOAD OR RUN.</div><div style="margin-top:12px;opacity:0.85">LIKELY CAUSES:</div><div>&#183; SAFARI ADVANCED PRIVACY PROTECTIONS BLOCKING WEBGL &#8212; TAP &#8220;REDUCE PROTECTIONS&#8221; IF OFFERED, OR SETTINGS &#8594; SAFARI &#8594; ADVANCED</div><div>&#183; A WEAK CONNECTION &#8212; THE 3D ENGINE IS A LARGE ONE-TIME DOWNLOAD</div><div style="margin-top:16px"><a href="" style="color:#ffb000;border:1px solid #ffb000;padding:8px 14px;text-decoration:none">RELOAD</a></div>';document.body.appendChild(d)}window.addEventListener('error',function(){setTimeout(show,1500)},true);setTimeout(show,12000)})()</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
