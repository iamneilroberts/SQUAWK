# Serves the built SPA and proxies /api to the backend container, so the browser's
# relative /api/... calls (see src/data/api.ts) work the same as they do behind Vite's
# dev proxy (vite.config.ts). "backend" is the compose service name, resolved via
# Docker's internal DNS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8020/api/;
        proxy_set_header Host $host;
    }

    # SPA fallback — client-side routing (if any is added later) still resolves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
